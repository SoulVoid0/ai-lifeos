# Builds the Windows app (installer with the backend inside) and publishes it as a GitHub Release with the
# signed latest.json manifest that the app's updater reads. Run it from Actions -> Release -> Run workflow,
# push a tag like v0.2.0, or push a commit whose message contains [release] (this also works on branches other
# than the default one, where Run workflow isn't offered). Untagged runs are numbered
# <major>.<minor>.<run number> from tauri.conf.json.
#
# Needs three repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the .key file from `tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the password chosen for it
#   TAURI_UPDATER_PUBKEY                contents of the matching .key.pub file
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown in the app)"
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same commit pushed to a second branch (a fast-forward merge) would otherwise be published twice.
  check:
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.dup.outputs.released }}
    steps:
      - id: dup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] && gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq '.[].target_commitish' | grep -qx "$GITHUB_SHA"; then
            echo "Already released; nothing to do."
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.released != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      LIFEOS_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Check the signing secrets
        shell: pwsh
        run: |
          $missing = @("TAURI_SIGNING_PRIVATE_KEY", "TAURI_SIGNING_PRIVATE_KEY_PASSWORD", "LIFEOS_UPDATER_PUBKEY") |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) { throw "Missing repository secrets: $($missing -join ', ' -replace 'LIFEOS_UPDATER_PUBKEY', 'TAURI_UPDATER_PUBKEY'). See the top of release.yml." }

      - name: Pick the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $base = (Get-Content frontend/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version.Split(".")
            $v = "$($base[0]).$($base[1]).$($env:GITHUB_RUN_NUMBER)"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          $conf = @{
            version = $v
            bundle  = @{ externalBin = @("binaries/lifeos-backend"); createUpdaterArtifacts = $true }
            plugins = @{ updater = @{ pubkey = $env:LIFEOS_UPDATER_PUBKEY.Trim() } }
          }
          $conf | ConvertTo-Json -Depth 6 | Set-Content frontend/src-tauri/tauri.ci.conf.json -Encoding utf8
          Write-Host "Building AI LifeOS $v"

      - name: Build backend, app and installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -TauriConfig src-tauri/tauri.ci.conf.json

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $nsis = "frontend/src-tauri/target/release/bundle/nsis"
          $setup = Get-ChildItem $nsis -Filter "*_$($env:VERSION)_*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "No installer for $env:VERSION in $nsis" }
          # A name without spaces, so the asset keeps exactly this name on GitHub.
          $name = "AI-LifeOS_$($env:VERSION)_x64-setup.exe"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $setup.FullName "out/$name"
          $notes = if ($env:NOTES) { $env:NOTES } else { "Built from $env:GITHUB_REF_NAME at $($env:GITHUB_SHA.Substring(0, 7))." }
          $manifest = [ordered]@{
            version   = $env:VERSION
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content "$($setup.FullName).sig" -Raw).Trim()
                url       = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$($env:VERSION)/$name"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content out/latest.json -Encoding utf8
          gh release create "v$($env:VERSION)" "out/$name" out/latest.json --target $env:GITHUB_SHA `
            --title "AI LifeOS $($env:VERSION)" --notes $notes --latest
