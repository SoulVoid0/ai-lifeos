# Publishes an OS image build as a GitHub pre-release, split into parts under 2 GB (the asset limit).
# Release downloads come from GitHub's CDN and are much faster than workflow artifacts.
# Runs after each successful "OS image" build, or when a pushed commit message contains [os-publish]
# (then it publishes the latest successful build). Pre-releases don't affect the Windows app's updater.
name: OS publish

on:
  workflow_run:
    workflows: ["OS image"]
    types: [completed]
  push:
    branches: ["**"]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[os-publish]'))
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Find the build
        id: run
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            gh api "repos/${{ github.repository }}/actions/workflows/os-image.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0] | "id=\(.id)\nsha=\(.head_sha)"' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: iso

      - name: Split and publish
        run: |
          ISO=$(find iso -name '*.iso' | head -1)
          NAME=$(basename "$ISO" .iso)
          mkdir parts
          sha256sum "$ISO" | awk '{print $1}' > "parts/$NAME.iso.sha256"
          split -b 1900M -d -a 1 "$ISO" "parts/$NAME.iso.part"
          ls -lh parts
          TAG="os-${NAME#AI-LifeOS-}"
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" parts/* --repo "${{ github.repository }}" --prerelease \
            --target "${{ steps.run.outputs.sha }}" --title "AI LifeOS OS image ${NAME#AI-LifeOS-} (test build)" \
            --notes "Bootable installer for the LifeOS operating system (Fedora bootc). Download every .part file, join them into one .iso (see docs/OS-ROADMAP.md), write it to a USB stick with Rufus (DD mode). The installer erases the disk you choose."
