# Builds the AI LifeOS operating system: an Arch Linux live ISO and an installer ISO (archiso) that boots straight into
# LifeOS, plus the `lifeos` pacman package it installs. Runs when a pushed commit message contains [os-image],
# or from Actions -> OS image -> Run workflow. Published as a pre-release (ISOs over 2 GB in parts).
name: OS image

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: os-image
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[os-image]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Tools
        run: |
          pacman -Syu --noconfirm --needed archiso base-devel python python-pip nodejs npm git zstd github-cli sdl2 sdl2_ttf gtk4 pkgconf dbus
          useradd -m builder

      - uses: actions/checkout@v4

      - name: Web UI
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Stage the package sources
        run: |
          S=os/arch/pkg/src-stage
          mkdir -p $S/ollama $S/files
          python -m pip install --no-cache-dir --break-system-packages --target $S/site ./backend
          cp -a frontend/dist $S/web
          cp -a os/files/. $S/files/
          base=https://github.com/ollama/ollama/releases/latest/download
          if curl -fsSL -o /tmp/o.tar.zst "$base/ollama-linux-amd64.tar.zst"; then zstd -dc /tmp/o.tar.zst | tar -x -C $S/ollama
          else curl -fsSL "$base/ollama-linux-amd64.tgz" | tar -xz -C $S/ollama; fi
          rm -rf $S/ollama/lib/ollama/cuda_* $S/ollama/lib/ollama/*cuda* 2>/dev/null || true
          du -sh $S/*

      - name: Build the 3D apartment
        run: |
          make -C apartment
          cp apartment/lifeos-apartment os/arch/pkg/src-stage/lifeos-apartment-bin

      - name: "Build the lsiw package (LSIW with C: at /)"
        run: |
          chown -R builder os/arch/lsiw
          cd os/arch/lsiw && sudo -u builder makepkg --nodeps --noconfirm
          mkdir -p /repo && cp lsiw-*.pkg.tar.zst /repo/

      - name: Build the lifeos package
        run: |
          VER=0.1.${{ github.run_number }}
          sed -i "s/^pkgver=.*/pkgver=$VER/" os/arch/pkg/PKGBUILD
          chown -R builder os/arch/pkg
          cd os/arch/pkg && sudo -u builder makepkg --nodeps --noconfirm
          mkdir -p /repo && cp lifeos-*.pkg.tar.zst /repo/ && repo-add /repo/lifeos.db.tar.gz /repo/*.pkg.tar.zst

      - name: Build the ISOs (live and installer)
        run: |
          rm -rf /var/cache/pacman/pkg/*
          bash scripts/mkisos.sh "${{ github.run_number }}" out
          ls -lh out

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf /tmp/lifeos-work /var/cache/pacman/pkg/*  # mkarchiso's work tree fills the runner's disk
          mkdir -p publish
          cp /repo/*.pkg.tar.zst publish/
          for ISO in out/*.iso; do
            sha256sum "$ISO" | awk '{print $1}' > "publish/$(basename "$ISO").sha256"
            if [ "$(stat -c %s "$ISO")" -lt 2000000000 ]; then mv "$ISO" publish/
            else split -b 1900M -d -a 1 "$ISO" "publish/$(basename "$ISO").part" && rm "$ISO"; fi
          done
          ls -lh publish
          gh release create "os-arch-${{ github.run_number }}" publish/* --repo "${{ github.repository }}" --prerelease \
            --target "${{ github.sha }}" --title "AI LifeOS (Arch) ${{ github.run_number }} (test build)" \
            --notes "Two ISOs (write either to a USB stick with Rufus in DD mode; if an ISO is in parts, join them first). AI-LifeOS: the live system, boots straight into the LifeOS 3D apartment (walk with WASD, E on the PC in the master bedroom for the KDE desktop, Shift+F4 back; Install AI LifeOS is in its app menu). AI-LifeOS-Installer: boots straight into the installer (language, keyboard, time zone, disk: erase, next to another system or one partition, your account, LSIW level and location, GRUB)."
