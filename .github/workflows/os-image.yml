# Builds the AI LifeOS operating system (os/Containerfile) and turns it into an installer ISO.
# Runs when a pushed commit's message contains [os-image], or from Actions -> OS image -> Run workflow.
# Output: the bootc container image on ghcr.io (used later for `bootc upgrade`) and the ISO as a downloadable
# workflow artifact (GitHub Releases can't hold files over 2 GB).
name: OS image

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read
  packages: write

concurrency:
  group: os-image
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[os-image]')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Build the system image
        run: |
          sudo podman build --pull=newer -f os/Containerfile -t localhost/ai-lifeos-os:latest .

      - name: Push to GitHub Container Registry
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/ai-lifeos-os
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman tag localhost/ai-lifeos-os:latest "$IMAGE:latest" "$IMAGE:${{ github.run_number }}"
          sudo podman push "$IMAGE:latest"
          sudo podman push "$IMAGE:${{ github.run_number }}"

      - name: Make the installer ISO
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs \
            localhost/ai-lifeos-os:latest
          sudo chown -R "$USER" output
          ISO=$(find output -name '*.iso' | head -1)
          mv "$ISO" "output/AI-LifeOS-${{ github.run_number }}.iso"
          ls -lh output

      - uses: actions/upload-artifact@v4
        with:
          name: AI-LifeOS-iso-${{ github.run_number }}
          path: output/AI-LifeOS-*.iso
          compression-level: 0
          retention-days: 30
