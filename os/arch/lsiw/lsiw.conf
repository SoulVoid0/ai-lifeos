# LSIW system-wide configuration on LifeOS (/etc/lsiw/lsiw.conf)
#
# LifeOS builds LSIW into the operating system: the C: drive is the root of the file system, so a Windows
# program sees Linux exactly as it is (C:\home\you is /home/you, C:\run\media\you\USB is your USB stick) and
# the Windows folders are real folders in / (C:\windows is /windows, C:\Program Files is /Program Files).
# Each user's ~/.config/lsiw/lsiw.conf is read after this file and wins; `lsiw config` and LSIW Control
# (lsiw-control) write that one. The full list of settings is in `lsiw help config`.

[engine]
#default = auto

[drive]
# The C: drive. On LifeOS it is "/" and can only be changed here, by an administrator.
c_drive = /

[variables]
# The folders Windows expects right under C:\ (created at boot by /usr/lib/tmpfiles.d/lifeos-lsiw.conf).
WINDIR = /windows
CSIDL_PROGRAM_FILES = /Program Files
CSIDL_PROGRAM_FILESX86 = /Program Files (x86)
CSIDL_COMMON_APPDATA = /ProgramData
PROFILESFOLDER = /users
