# LifeOS: with C: at the root of the file system, the Windows folders Windows programs expect right under C:\
# are real folders in /. Everyone may add to them; nobody may delete another user's files (sticky bit).
d "/windows"              1777 root root -
d "/Program Files"        1777 root root -
d "/Program Files (x86)"  1777 root root -
d "/ProgramData"          1777 root root -
d "/users"                1777 root root -
